name: strudel-point

# Kafka/Postgres/Valkey publish NO host ports — every service reaches them by name
# (kafka:9092, postgres:5432, valkey:6379) over Docker's internal DNS, so nothing here
# competes with whatever's already bound to those ports on your machine. If you want
# host-side tool access (psql, a Kafka UI, etc),
# add your own `ports:` override locally or use `docker compose exec <service> ...`.
#
# gateway and web *do* publish host ports, both for things a browser has to reach
# directly: web's Vite server, and gateway's /ws (see the comment on gateway's `ports:`
# below for why the browser can't just go through Vite's proxy for that one).

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: strudel-point-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: strudelpointkraftcluster1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # There is no object-storage service in this stack. Sample audio goes to Wasabi in dev
  # as in production — see the gateway's S3_* environment below. This replaced a local
  # RustFS container; one storage backend everywhere means dev never passes against a
  # server prod doesn't run, but it does mean uploads now need credentials in .env and a
  # network, and that they land in a real bucket that bills a 90-day minimum per object.
  # Point S3_BUCKET at a scratch bucket, not the production one.

  postgres:
    image: postgres:16-alpine
    container_name: strudel-point-postgres
    environment:
      POSTGRES_DB: strudel_point
      POSTGRES_USER: strudel
      POSTGRES_PASSWORD: strudel
    volumes:
      - strudel-point-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strudel -d strudel_point"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cross-instance presence + the autosave write buffer (see apps/gateway/src/valkey.ts).
  # No host port, same reasoning as kafka/postgres — only the gateway talks to it.
  #
  # No volume, deliberately: everything in here is either presence (regenerated by the next
  # 30s heartbeat) or a buffered autosave whose durable copy is Postgres. Persisting it
  # would imply a durability this layer explicitly doesn't promise — and the gateway is
  # written to run fine without this service at all (presence degrades to per-instance,
  # autosave writes straight through to Postgres), so a cold start losing it is a supported
  # state, not an outage.
  valkey:
    image: valkey/valkey:8-alpine
    container_name: strudel-point-valkey
    # Cache semantics made explicit rather than left to the default (no limit, then the
    # container OOMs): evict the least-recently-used key when full. Presence keys carry
    # their own TTL and autosave buffers are re-created by the next keystroke, so eviction
    # is a cache miss, not data loss.
    command: ["valkey-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Stem separation for the sample editor's "separate into stems" action (see
  # apps/gateway/src/routes/stems.ts, the one caller, and packages/library/src/
  # SampleEditor.tsx for the UI). No host port published — same reasoning as
  # kafka/postgres above, only the gateway ever talks to this, over Docker-internal
  # DNS (spleeter:8100).
  #
  # UNVERIFIED — flagging clearly rather than guessing quietly: I haven't actually built
  # this image from here. See apps/spleeter/Dockerfile's own header for specifics on
  # what's unverified about it. Health-checked over plain HTTP; a first build can take a
  # long time to bake the model in — the generous `start_period` is for that, not for
  # slow requests.
  spleeter:
    build:
      context: apps/spleeter
    container_name: strudel-point-spleeter
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8100/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile.dev
    container_name: strudel-point-gateway
    # Published so the browser can open its /ws WebSocket directly against the gateway,
    # bypassing Vite's dev-server proxy: under Bun, Vite's proxy (http-proxy under the
    # hood) never observes the 'upgrade' event on a proxied 101 response, so a proxied
    # WS connection sends/receives the join ack but silently never completes the
    # handshake — no error, no close, it just hangs forever. Plain HTTP proxying (/api)
    # is unaffected; only the WS upgrade path breaks under Bun's http.request. See
    # apps/web/src/ws.ts for the client side of this.
    ports:
      - "8787:8787"
    environment:
      DATABASE_URL: postgres://strudel:strudel@postgres:5432/strudel_point
      KAFKA_BROKERS: kafka:9092
      # Wasabi, from your .env — the one set of credentials this dev stack does not
      # hardcode, because there is no local server to hardcode them against any more.
      # The endpoint host is region-scoped and must agree with S3_REGION.
      S3_ENDPOINT: ${S3_ENDPOINT:-s3.wasabisys.com}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PORT: "443"
      S3_USE_SSL: "true"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env — see .env.example}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env — see .env.example}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env — use a scratch bucket, not prod}
      S3_PROVISION: ${S3_PROVISION:-false}
      VALKEY_URL: valkey://valkey:6379
      SPLEETER_URL: http://spleeter:8100
      # The in-room chatbot (apps/gateway/src/chat/). Nothing configured, no bot — the chat
      # panel still works as plain room chat and file drops still sonify, they just go
      # unanswered. Default provider is Claude; set CHAT_PROVIDER=openai-compatible plus
      # CHAT_BASE_URL to run the same room tools against Ollama/vLLM/LM Studio/OpenAI.
      CHAT_PROVIDER: ${CHAT_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_DISABLE_THINKING: ${CHAT_DISABLE_THINKING:-false}
      CORS_ORIGIN: "*" # only Vite's server-side proxy calls the gateway; browser never does
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: strudel-point-gateway
    volumes:
      - .:/app
      - strudel-point-gateway-node-modules:/app/node_modules
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
      # service_started, not service_healthy: unlike the two above, the gateway is
      # written to work without this one (see apps/gateway/src/valkey.ts), so waiting on it
      # would add a startup dependency the code deliberately doesn't have.
      valkey: {condition: service_started}
      # service_started, not service_healthy like kafka/postgres above — spleeter's
      # healthcheck can take a long time (or never pass, given how fragile its dependency
      # pins are) and stem separation is one optional feature, not core to the app; the
      # rest of the gateway shouldn't be held hostage to it starting. A request that hits
      # /separate before spleeter is actually ready just fails with a clear "couldn't
      # reach the stem-separation service" error (see routes/stems.ts) instead of the
      # whole stack refusing to come up.
      spleeter: {condition: service_started}
      otel-collector: {condition: service_started}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: strudel-point-web
    # A small range, not a single port: Docker itself binds the first free one, so this
    # doesn't collide with whatever's already using 5173 on your machine. Check
    # `docker compose port web 5173` (or just `docker compose ps`) to see which it picked.
    ports:
      - "5173-5178:5173"
    volumes:
      - .:/app
      - strudel-point-web-node-modules:/app/node_modules
    depends_on:
      - gateway

  dj:
    build:
      context: .
      dockerfile: apps/dj/Dockerfile.dev
    container_name: strudel-point-dj
    # A separate app from `web` (same idea as its port range) — a DJ deck/crossfader UI
    # that talks to the same gateway/room. Still reachable directly on whichever port in
    # this range Docker picks free, but also fronted by `caddy` at /dj on one origin —
    # BASE_PATH makes this container's own asset/module requests carry that /dj prefix
    # (see apps/dj/vite.config.ts), so direct access now needs the same /dj/ suffix too.
    ports:
      - "5179-5184:5179"
    environment:
      BASE_PATH: "/dj/"
    volumes:
      - .:/app
      - strudel-point-dj-node-modules:/app/node_modules
    depends_on:
      - gateway

  pads:
    build:
      context: .
      dockerfile: apps/pads/Dockerfile.dev
    container_name: strudel-point-pads
    # A separate app again from `web`/`dj` (same idea as their port ranges) — a 16-pad
    # sampler UI that talks to the same gateway/room. Still reachable directly on
    # whichever port in this range Docker picks free, but also fronted by `caddy` at
    # /pads on one origin — BASE_PATH makes this container's own asset/module requests
    # carry that /pads prefix (see apps/pads/vite.config.ts), so direct access now needs
    # the same /pads/ suffix too.
    ports:
      - "5185-5190:5185"
    environment:
      BASE_PATH: "/pads/"
    volumes:
      - .:/app
      - strudel-point-pads-node-modules:/app/node_modules
    depends_on:
      - gateway

  patch-panel:
    build:
      context: .
      dockerfile: apps/patch-panel/Dockerfile.dev
    container_name: strudel-point-patch-panel
    # A fourth independent app (same idea as dj/pads) — a Novation-Peak-style synth
    # designer (oscillator, filter, amp/pitch envelopes, filter + vibrato LFOs) that
    # triggers voices directly via superdough for live preview, and can turn the current
    # patch + a played sequence into real Strudel source, same as pads' rack. Still
    # reachable directly on whichever port in this range Docker picks free, but also
    # fronted by `caddy` at /patch on one origin — BASE_PATH makes this container's own
    # asset/module requests carry that /patch prefix (see apps/patch-panel/vite.config.ts).
    ports:
      - "5191-5196:5191"
    environment:
      BASE_PATH: "/patch/"
    volumes:
      - .:/app
      - strudel-point-patch-panel-node-modules:/app/node_modules
    depends_on:
      - gateway

  # All-in-one Jaeger: UI + native OTLP receiver + in-memory storage. In-memory means
  # traces don't survive `docker compose down` — fine for local dev, swap the storage
  # backend (Cassandra/Elasticsearch/etc via env) if you need durable traces.
  jaeger:
    build: ./docker/jaeger
    container_name: strudel-point-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    # A small range, not a single port (same idea as web/dj/pads below): Docker binds
    # whichever's actually free, so this doesn't collide with another project's own
    # Jaeger/otel stack already sitting on the common default ports. Run
    # `docker compose port jaeger 16686` (or `docker compose ps`) to see which it picked.
    ports:
      - "16686-16690:16686" # Jaeger UI
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:16686/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Single fixed OTLP endpoint every instrumented service points at (see
  # otel/otel-collector-config.yaml) — traces are batched here and forwarded to Jaeger.
  # No host ports published, same reasoning as kafka/postgres above: only the
  # gateway talks to this, over Docker-internal DNS (otel-collector:4317/4318), so
  # there's nothing here for a host port to collide with.
  otel-collector:
    build: ./docker/otel-collector
    container_name: strudel-point-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      jaeger: {condition: service_healthy}

  # Scrapes gateway's and spleeter's /metrics endpoints (see apps/gateway/src/metrics.ts
  # and apps/spleeter/server.py) — separate signal from the otel-collector/jaeger pair
  # above (traces), not a replacement for it. Config lives in ./prometheus/prometheus.yml,
  # not inline here, so it stays diffable/reviewable on its own.
  prometheus:
    build: ./docker/prometheus
    container_name: strudel-point-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - strudel-point-prometheusdata:/prometheus
    # A small range, not a single port (same idea as jaeger/web/dj/pads above): Docker
    # binds whichever's actually free. Run `docker compose port prometheus 9090` (or
    # `docker compose ps`) to see which it picked.
    ports:
      - "9090-9095:9090"
    depends_on:
      gateway: {condition: service_started}
      spleeter: {condition: service_started}

  caddy:
    build: ./docker/caddy
    container_name: strudel-point-caddy
    # The one-stop-shop origin: "/" -> web, "/dj" -> dj, "/pads" -> pads (see
    # ./Caddyfile). No app's own published port goes away — this just adds one more way
    # in that doesn't require remembering which port got picked for which app.
    ports:
      - "8088:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - dj
      - pads

volumes:
  strudel-point-pgdata:
  strudel-point-gateway-node-modules:
  strudel-point-web-node-modules:
  strudel-point-dj-node-modules:
  strudel-point-pads-node-modules:
  strudel-point-patch-panel-node-modules:
  strudel-point-prometheusdata:
