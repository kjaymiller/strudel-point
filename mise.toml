[tools]
bun = "1.3.14"

[tasks.install]
description = "Install JS dependencies (for host-side editor/tsc support — containers install their own copy)"
run = "bun install"

[tasks."docker:up"]
description = "Build + start everything: Kafka, Postgres, Valkey, gateway, web"
run = "docker compose up -d --build"

[tasks."docker:down"]
description = "Stop everything"
run = "docker compose down"

[tasks.migrate]
description = "Apply db/migrations/*.sql, run from inside the gateway container (Postgres has no host port)"
run = "docker compose run --rm gateway bun scripts/migrate.mjs"
depends = ["docker:up"]

[tasks.dev]
description = "Start everything and follow gateway + web logs"
run = "docker compose logs -f gateway web"
depends = ["docker:up"]

[tasks.build]
description = "Build gateway + web for production (runs on the host, not in a container)"
run = "bun run build"
